[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra
cache_dir = /tmp/neatify_pytest_cache
markers =
    safety: filesystem safety and data-integrity tests
    known_defect: documents a currently known defect that must be fixed later
    fault_injection: simulates filesystem or persistence failures
    slow: slower tests or benchmarks that should not run on every quick check
